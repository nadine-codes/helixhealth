<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1200px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Text",Helvetica,sans-serif;position:relative;
 background:#0b1f2a;}
.bg{position:absolute;inset:0;
 background:
  radial-gradient(900px 700px at 8% 10%, #14b8a6 0%, transparent 60%),
  radial-gradient(900px 800px at 95% 15%, #6366f1 0%, transparent 60%),
  radial-gradient(1000px 700px at 70% 105%, #0ea5e9 0%, transparent 60%),
  radial-gradient(800px 600px at 10% 100%, #8b5cf6 0%, transparent 65%),
  linear-gradient(135deg,#0f766e,#312e81);}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.grid{position:absolute;inset:0;opacity:.07;
 background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
 background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.window{position:absolute;left:50%;top:86px;transform:translateX(-50%);width:1560px;border-radius:18px;overflow:hidden;
 background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 50px 120px -20px rgba(2,6,23,.65),0 30px 60px -30px rgba(2,6,23,.5)}
.bar{height:52px;background:#f4f5f7;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 20px;position:relative}
.dots{display:flex;gap:9px}.dots i{width:13px;height:13px;border-radius:50%;display:block}
.url{position:absolute;left:50%;transform:translateX(-50%);width:520px;height:32px;border-radius:9px;background:#e9ebef;
 display:flex;align-items:center;justify-content:center;gap:8px;color:#4b5563;font-size:14px}
.window img{display:block;width:100%}
</style></head><body>
<div class="bg"></div><div class="grid"></div><div class="grain"></div>
<div class="window">
 <div class="bar"><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="url"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>helixhealth.app/dashboard</div></div>
 <img src="dashboard.png">
</div>
</body></html>
