<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1200px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display",Inter,Helvetica,sans-serif;position:relative;background:#eef5f7}
.bg{position:absolute;inset:0;background:
  radial-gradient(1300px 900px at 0% 0%, #c9ecdf 0%, rgba(201,236,223,.55) 35%, transparent 70%),
  radial-gradient(1100px 800px at 100% 100%, #d9e9f8 0%, transparent 65%),
  radial-gradient(900px 600px at 100% 0%, #e6eefb 0%, transparent 60%),
  #eef5f7}
.helix{position:absolute;pointer-events:none}
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:multiply;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.brand{position:absolute;left:220px;top:58px;display:flex;align-items:center;gap:14px;color:#0d9488;font-weight:600;font-size:28px;letter-spacing:-.02em}
.tag{position:absolute;right:220px;top:66px;font-size:20px;color:#5b6b80;letter-spacing:-.01em}
.tag b{color:#0f172a;font-weight:600}
.window{position:absolute;left:50%;top:136px;transform:translateX(-50%);width:1480px;border-radius:18px;overflow:hidden;background:#fff;
 box-shadow:0 0 0 1px rgba(30,80,70,.10),0 1px 1px rgba(30,70,60,.05),0 4px 8px -2px rgba(30,70,60,.06),0 28px 56px -18px rgba(25,75,70,.20),0 70px 130px -40px rgba(25,75,70,.26)}
.bar{height:50px;background:#f7f9f9;border-bottom:1px solid #e7ecec;display:flex;align-items:center;padding:0 20px;position:relative}
.dots{display:flex;gap:9px}.dots i{width:13px;height:13px;border-radius:50%;display:block}
.url{position:absolute;left:50%;transform:translateX(-50%);width:500px;height:31px;border-radius:9px;background:#edf1f1;
 display:flex;align-items:center;justify-content:center;gap:8px;color:#4b5563;font-size:14px}
.window img{display:block;width:100%}
</style></head><body>
