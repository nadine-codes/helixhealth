<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:3600px}
body{background:#18181b;font-family:-apple-system,"SF Pro Display",Inter,Helvetica,sans-serif;color:#fafafa;padding:56px 64px 64px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 48px;align-items:end}
.label{display:flex;align-items:baseline;gap:14px;margin-bottom:-8px}
.label b{font-size:36px;font-weight:600;letter-spacing:-.02em}
.label span{font-size:20px;color:#a1a1aa}
.sec{grid-column:1/-1;font-size:18px;color:#71717a;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 -24px}
.shot{border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 60px -20px rgba(0,0,0,.6)}
.shot img{display:block;width:100%}
</style></head><body><div class="grid">
<div class="label"><b>UI 1</b><span>original · color bars · teal → indigo</span></div>
<div class="label"><b>UI 2</b><span>flat mint #f0faf5 · white cards · tinted pills</span></div>
<div class="label"><b>Current</b><span>mint glow · sky blue · teal → blue</span></div>
<p class="sec">Login</p>
<div class="shot"><img src="ui1-login.png"></div><div class="shot"><img src="ui2-login.png"></div><div class="shot"><img src="current-login.png"></div>
<p class="sec">Dashboard</p>
<div class="shot"><img src="ui1-dashboard.png"></div><div class="shot"><img src="ui2-dashboard.png"></div><div class="shot"><img src="current-dashboard.png"></div>
<p class="sec">Ask Helix why</p>
<div class="shot"><img src="ui1-askwhy.png"></div><div class="shot"><img src="ui2-askwhy.png"></div><div class="shot"><img src="current-askwhy.png"></div>
</div></body></html>
