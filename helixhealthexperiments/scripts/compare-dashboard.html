<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:2560px;height:880px;overflow:hidden}
body{background:#18181b;font-family:-apple-system,"SF Pro Display",Inter,Helvetica,sans-serif;display:flex;gap:48px;padding:48px 56px 56px;color:#fafafa}
.col{flex:1;display:flex;flex-direction:column;gap:20px}
.label{display:flex;align-items:baseline;gap:14px}
.label b{font-size:30px;font-weight:600;letter-spacing:-.02em}
.label span{font-size:20px;color:#a1a1aa}
.shot{border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 60px -20px rgba(0,0,0,.6)}
.shot img{display:block;width:100%}
</style></head><body>
<div class="col"><div class="label"><b>Current (live)</b><span>grey-blue base · mint/blue/lavender glows · color bars</span></div><div class="shot"><img src="old.png"></div></div>
<div class="col"><div class="label"><b>New (unpushed)</b><span>solid mint #f0faf5 · white cards · layered shadows</span></div><div class="shot"><img src="new.png"></div></div>
</body></html>
