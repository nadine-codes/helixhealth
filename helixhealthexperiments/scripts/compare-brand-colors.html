<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:2560px}
body{background:#18181b;font-family:-apple-system,"SF Pro Display",Inter,Helvetica,sans-serif;color:#fafafa;padding:48px 56px 56px}
.head{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:20px}
.label{display:flex;align-items:baseline;gap:14px}
.label b{font-size:30px;font-weight:600;letter-spacing:-.02em}
.label span{font-size:20px;color:#a1a1aa}
.row{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:40px}
.row:last-child{margin-bottom:0}
.shot{border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 60px -20px rgba(0,0,0,.6)}
.shot img{display:block;width:100%}
.sec{font-size:18px;color:#71717a;text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px}
</style></head><body>
<div class="head">
 <div class="label"><b>Current (live)</b><span>lavender glow · teal → indigo gradients</span></div>
 <div class="label"><b>New (local)</b><span>bigger mint glow · sky blue glow · teal → blue gradients</span></div>
</div>
<p class="sec">Login</p><div class="row"><div class="shot"><img src="current-login.png"></div><div class="shot"><img src="new-login.png"></div></div>
<p class="sec">Dashboard</p><div class="row"><div class="shot"><img src="current-dashboard.png"></div><div class="shot"><img src="new-dashboard.png"></div></div>
<p class="sec">Ask Helix why</p><div class="row"><div class="shot"><img src="current-askwhy.png"></div><div class="shot"><img src="new-askwhy.png"></div></div>
</body></html>
