<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1200px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Text",Helvetica,sans-serif;position:relative;background:#e4f3ec}
.bg{position:absolute;inset:0;
 background:
  radial-gradient(1100px 760px at 12% 8%, rgba(255,255,255,.9) 0%, transparent 62%),
  radial-gradient(1000px 800px at 92% 96%, #cfe9df 0%, transparent 64%),
  radial-gradient(900px 700px at 96% 4%, #e9f4f6 0%, transparent 60%),
  linear-gradient(160deg,#f2faf6 0%,#e4f3ec 52%,#d6ece3 100%);}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.window{position:absolute;left:50%;top:86px;transform:translateX(-50%);width:1560px;border-radius:18px;overflow:hidden;background:#fff;
 box-shadow:0 0 0 1px rgba(40,90,75,.10),0 1px 1px rgba(30,70,60,.05),0 4px 8px -2px rgba(30,70,60,.06),0 24px 48px -16px rgba(30,80,66,.16),0 60px 120px -40px rgba(30,80,66,.22)}
.bar{height:52px;background:#f7f9f8;border-bottom:1px solid #e7ecea;display:flex;align-items:center;padding:0 20px;position:relative}
.dots{display:flex;gap:9px}.dots i{width:13px;height:13px;border-radius:50%;display:block}
.url{position:absolute;left:50%;transform:translateX(-50%);width:520px;height:32px;border-radius:9px;background:#edf1ef;
 display:flex;align-items:center;justify-content:center;gap:8px;color:#4b5563;font-size:14px}
.window img{display:block;width:100%}
</style></head><body>
<div class="bg"></div><div class="grain"></div>
<div class="window">
 <div class="bar"><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="url"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>tryhelixhealth.com/dashboard</div></div>
 <img src="dashboard3.png">
</div>
</body></html>
